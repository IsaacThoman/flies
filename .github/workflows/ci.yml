name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to main waits for the release in progress instead of cancelling it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Matches the Dockerfile's node:24-alpine image.
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/brain
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run tvos:typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/brain
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
