name: CI

# Not on pull requests: a full run takes a quarter of an hour, too long to hold every pull request
# for, so breakage shows on dev instead.
on:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push waits for the run in progress, so busy branches still finish runs and show breakage.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Matches the Dockerfile's node:24-alpine image.
          node-version: 24
          cache: npm
      - run: npm ci
      # Coolify reads only compose.yaml, so check it separately from plain hosting.
      - run: node scripts/checkCompose.ts
      # The web build carries the brain.
      - uses: ./.github/actions/brain
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run tvos:typecheck
      - run: npm run build

  test:
    # On Apple silicon, as the brain's bit-for-bit tests need: the native brain and the committed
    # WebAssembly reproduce Node's Math there, where V8 is built with clang and fuses
    # multiply-adds (packages/brain-native/wasm.sh, README.md). Node on x86-64 or on Linux arm64
    # rounds some of them differently in the last bit, and those tests fail there.
    runs-on: macos-latest
    steps:
      # The runner boots minutes before the job, and Spotlight indexes the checkout and node_modules
      # on one or two of its three cores into the speed budgets, which turn measurements taken beside
      # other processes away (scripts/cpuBudget.ts).
      - run: sudo mdutil -a -i off
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/brain
      - run: npm test

  e2e-suite:
    # The game in headless Chromium with the real brain, then the built site (npm run e2e, a suite
    # a job, side by side). There's no GPU here, so Chromium draws in software, a few frames a
    # second. The suites hold the picture at its full level, keep the screensaver away and set the
    # pages' clocks to morning (holdSteady in scripts/play.ts), rather than let the game's adaptive
    # quality (apps/web/src/quality.ts) draw the fly in pixels too big for the X-ray or the real
    # hour put it to sleep, and they wait on game time or frames, not the clock.
    name: e2e (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [play, pointer, web, tables]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/brain
      - run: npx playwright install --with-deps chromium
      - run: node apps/web/e2e/${{ matrix.suite }}.e2e.ts

  release:
    # A push to main with something new since the last v* tag (release.config.mjs) tags it and
    # creates a GitHub Release, once the checks pass. A run whose commit main has moved past
    # releases nothing; the run for the newer commit does.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  testflight:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/testflight.yml
    with:
      version: ${{ needs.release.outputs.version }}
    # A called workflow sees no secrets, its environment's included, unless the caller passes them.
    secrets: inherit
