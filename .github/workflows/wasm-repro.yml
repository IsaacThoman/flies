name: WebAssembly reproducibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # wasm.sh also holds the pinned SDK version and download digests.
      - 'packages/brain-native/**'
      - '.github/workflows/wasm-repro.yml'
  push:
    branches: [dev, main]
    paths:
      - 'packages/brain-native/**'
      - '.github/workflows/wasm-repro.yml'

permissions:
  contents: read

concurrency:
  group: wasm-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: packages/brain-native/build/wasi-sdk-*
          key: wasi-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/brain-native/wasm.sh') }}
      # --check downloads the pinned, digest-verified SDK on a cache miss and compares
      # both modules and build.json. It neither skips nor replaces committed files.
      - name: Rebuild and compare committed modules
        run: packages/brain-native/wasm.sh --check
