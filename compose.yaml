services:
  web:
    image: flies-web:local
    build:
      context: .
      target: web
      args:
        FLY_SITE_URL: ${FLY_SITE_URL:-}
    environment:
      FLIES_DOMAIN: ${FLIES_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ROOMS_HOST: ${ROOMS_HOST:-rooms}
      ROOMS_PORT: ${ROOMS_PORT:-3000}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Tables of people's flies (docs/online.md): WebSockets at /rooms, which
  # Caddy proxies on the site's own origin. No published port, and no
  # depends_on: the site works while it is down. A deploy restarts it with
  # SIGTERM; it keeps its tables in the rooms_data volume and every device
  # comes back to its table.
  rooms:
    image: flies-rooms:local
    build:
      context: .
      target: rooms
    environment:
      PORT: ${ROOMS_PORT:-3000}
    volumes:
      - rooms_data:/data
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  rooms_data:
