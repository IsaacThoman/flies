# The stack Coolify deploys, for production and for each pull request preview
# (docs/deploy.md); it reads only this file. Nothing here is published on a
# host port or given a fixed image tag or container name, so a preview never
# collides with production. A plain `docker compose up` also merges
# compose.override.yaml, which publishes the site and names the images.
services:
  web:
    build:
      context: .
      target: web
      args:
        FLY_SITE_URL: ${FLY_SITE_URL:-}
        # Coolify's https:// address for this service, production's or a
        # preview's own; the build uses it when FLY_SITE_URL is unset.
        SERVICE_URL_WEB: ${SERVICE_URL_WEB:-}
        # Empty uses the build script's team; 0 disables app links.
        APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
        FLIES_OPERATOR_NAME: ${FLIES_OPERATOR_NAME:-}
        FLIES_CONTACT_EMAIL: ${FLIES_CONTACT_EMAIL:-}
        FLIES_SUPPORT_URL: ${FLIES_SUPPORT_URL:-}
        FLIES_MARKETING_URL: ${FLIES_MARKETING_URL:-}
    environment:
      ROOMS_HOST: ${ROOMS_HOST:-rooms}
      ROOMS_PORT: ${ROOMS_PORT:-3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      CLIENT_IP_HEADERS: ${CLIENT_IP_HEADERS:-X-Forwarded-For}
    # Plain HTTP for the proxy in front: Coolify's Traefik, given this
    # service's domain, or your own.
    expose:
      - "80"
    # Without certificates Caddy keeps nothing worth a volume; this stops the
    # image's declared /data and /config from leaving anonymous ones behind.
    tmpfs:
      - /data
      - /config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Tables of people's flies (docs/online.md): WebSockets at /rooms, which
  # Caddy proxies on the site's own origin. No public port, and no
  # depends_on: the site works while it is down. A deploy restarts it with
  # SIGTERM; it keeps its tables in the rooms_data volume and every device
  # comes back to its table.
  rooms:
    build:
      context: .
      target: rooms
    environment:
      PORT: ${ROOMS_PORT:-3000}
      # Caddy passes on the client's address, which rate limits count by.
      TRUST_PROXY: "1"
    volumes:
      - rooms_data:/data
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT}/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rooms_data:
