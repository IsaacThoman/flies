    <meta charset="UTF-8" />

    <meta name="description" content="A fruit fly that lives on your screen. A simplified simulation of its nervous system, 166,700 neurons wired from the FlyEM male CNS connectome (Janelia Research Campus, CC-BY 4.0), chooses through its senses; the game supplies physics, hunger, thirst and sleep drives, and a flight reflex." />
    <meta name="theme-color" content="#04122b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="flies" />
    <link rel="icon" type="image/png" href="../../assets/web/favicon.png" />
    <link rel="apple-touch-icon" href="../../assets/web/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="flies" />
    <meta property="og:description" content="A fruit fly driven by a simplified nervous-system model: 166,700 neurons wired from the FlyEM male CNS connectome (Janelia Research Campus, CC-BY 4.0)." />
    <meta property="og:image" content="../../assets/web/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A fruit fly standing on a picnic table under the word flies" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* The game draws everything itself and fills the screen, under the notch too: the page must never scroll, zoom, select or offer its own menus. */
      html, body { margin: 0; height: 100%; background: #04122b; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="game" width="640" height="480"></canvas>
    <script>
      // Nothing is drawn while the game loads; if its script can't load, this
      // says so and offers a reload. The game replaces this canvas before
      // requesting WebGL, since a canvas that has drawn in 2D cannot become a
      // WebGL canvas, and from then on these listeners stand down.
      (() => {
        const canvas = document.getElementById("game");
        canvas.dataset.boot = "true";
        let failed = false;
        const listeners = [[window, "error", (event) => {
          if (event.target === window || event.target instanceof HTMLScriptElement) fail();
        }, true], [window, "unhandledrejection", fail], [window, "keydown", retry], [canvas, "pointerup", retry], [window, "resize", draw]];
        for (const [target, type, listener, capture] of listeners) target.addEventListener(type, listener, capture);
        const replaced = () => {
          if (canvas.isConnected) return false;
          for (const [target, type, listener, capture] of listeners) target.removeEventListener(type, listener, capture);
          return true;
        };
        function fail() {
          if (replaced()) return;
          failed = true;
          draw();
        }
        function retry(event) {
          if (!replaced() && failed && (event.type === "pointerup" || event.key === "Enter")) location.reload();
        }
        function draw() {
          const g = !replaced() && failed && canvas.getContext("2d");
          if (!g) return;
          const h = 480, w = Math.max(240, Math.round(h * innerWidth / innerHeight)), y = h * 0.6;
          canvas.width = w;
          g.textAlign = "center";
          g.font = "16px ui-rounded, system-ui, sans-serif";
          g.fillStyle = "#effaff";
          g.fillText("Couldn't load", w / 2, h * 0.45);
          g.fillStyle = "rgba(240,252,255,0.2)";
          g.fillRect(w / 2 - 70, y - 22, 140, 38);
          g.strokeStyle = "#effaff";
          g.strokeRect(w / 2 - 70, y - 22, 140, 38);
          g.fillStyle = "#effaff";
          g.fillText("Try again", w / 2, y + 3);
          canvas.dataset.bootFailure = "true";
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
