# XcodeGen spec for the iPhone and iPad app; scripts/ios.ts generates the project and builds it.
# The team and bundle ID come from IOS_TEAM_ID and IOS_BUNDLE_ID (which fall back to the Apple
# TV app's: the two are one app in the App Store), the version from ../version.yml, and the
# Associated Domains entitlement from links.yml only when scripts/ios.ts is told IOS_LINKS=1.
name: Flies
include:
  - ../version.yml
  - path: links.yml
    enable: ${IOS_LINKS}
options:
  deploymentTarget:
    iOS: "26.0"
targets:
  Flies:
    type: application
    platform: iOS
    sources:
      - path: src
      # The web build and the connectome, copied here by scripts/ios.ts.
      - path: www
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: flies
        CFBundleName: flies
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # src/Launch.storyboard: the launch image, generated into src/generated/Assets.xcassets.
        UILaunchStoryboardName: Launch
        # One window: a second would be a second fly with a second brain.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_NAME: Flies
      PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}
      DEVELOPMENT_TEAM: ${IOS_TEAM_ID}
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "6.0"
      # The icon (light and dark) and launch image, generated by scripts/ios.ts from assets/ios.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [FliesTests, FliesUITests]
  # The app's own logic: the power policy and what the scheme handler serves.
  FliesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [tests/unit]
    dependencies:
      - target: Flies
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}.tests
      DEVELOPMENT_TEAM: ${IOS_TEAM_ID}
      SWIFT_VERSION: "6.0"
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Flies.app/Flies
      BUNDLE_LOADER: $(TEST_HOST)
  # The fly alive in the app, driven as a person would: npm run ios:check.
  FliesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/ui]
    dependencies:
      - target: Flies
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: ${IOS_BUNDLE_ID}.uitests
      DEVELOPMENT_TEAM: ${IOS_TEAM_ID}
      SWIFT_VERSION: "6.0"
      TEST_TARGET_NAME: Flies
