# XcodeGen spec for the Apple TV app; scripts/tvos.ts generates the project and builds it. The
# team and bundle ID come from TVOS_TEAM_ID and TVOS_BUNDLE_ID, and the brain's sources from
# TVOS_BRAIN_SOURCES (packages/brain-native/src, or the stand-in under tests/).
name: Flies
# The version, shared with the iPhone and iPad app (version.yml); the weather outside, off unless
# scripts/tvos.ts turns it on: the service (weather.yml), and WeatherKit's entitlement and location
# usage string (weatherkit.yml).
include:
  - ../version.yml
  - path: weather.yml
    enable: ${TVOS_WEATHER}
  - path: weatherkit.yml
    enable: ${TVOS_WEATHERKIT_ENTITLED}
options:
  deploymentTarget:
    tvOS: "26.0"
targets:
  Flies:
    type: application
    platform: tvOS
    sources:
      - path: src
      # The brain, with packages/brain-native/build.sh's release flags: -ffp-contract=off keeps
      # its arithmetic the same as the TypeScript simulation's.
      - path: ${TVOS_BRAIN_SOURCES}
        compilerFlags: ["-O2", "-DNDEBUG", "-ffp-contract=off"]
      # The runtime, the app's script, the connectome and the page's files, copied here by
      # scripts/tvos.ts.
      - path: www
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: JavaScriptCore.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: ImageIO.framework
      - sdk: Accelerate.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: GameController.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Flies
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The launch image, generated into src/generated/Assets.xcassets by scripts/tvos.ts.
        UILaunchScreen:
          UIImageName: Launch Image
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The Siri Remote's touch surface is read as a micro gamepad (src/Remote.mm).
        GCSupportedGameControllers:
          - ProfileName: MicroGamepad
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_NAME: Flies
      PRODUCT_BUNDLE_IDENTIFIER: ${TVOS_BUNDLE_ID}
      DEVELOPMENT_TEAM: ${TVOS_TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: NO
      CLANG_ENABLE_OBJC_ARC: YES
      CLANG_CXX_LANGUAGE_STANDARD: c++20
      HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../../packages/brain-native/include"]
      GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GLES_SILENCE_DEPRECATION=1"]
      # tvOS 26 is the last on the first Apple TV 4K: newer APIs need an @available check.
      OTHER_CFLAGS: ["$(inherited)", "-Werror=unguarded-availability-new"]
      GCC_OPTIMIZATION_LEVEL: s
      # The layered home-screen icon and Top Shelf images, generated by scripts/tvos.ts.
      ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
